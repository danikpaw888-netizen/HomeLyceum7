name: Validate HomeLyceum7

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Import app and create test schema
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-test.db
          JWT_SECRET: ci-only-test-secret
          BOOTSTRAP_ADMIN_EMAIL: admin@homelyceum.local
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-test-password
          UPLOAD_DIR: uploads-ci
        run: python -c "from app.main import app; print('HomeLyceum7 API loaded with', len(app.routes), 'routes')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
